[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcops"
version = "0.1.0"
description = "A local-model agent that investigates fictional data center alarms through its own MCP server."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "openai>=1.40,<3",
    "httpx",
    "opentelemetry-api",
    "opentelemetry-sdk",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp"]
dev = ["pytest>=8"]

[project.scripts]
dcops = "dcops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
